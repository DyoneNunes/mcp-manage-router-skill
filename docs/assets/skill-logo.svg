<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="skills-router-mcp: many skills routed to the one you need">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1324"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#16233A" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowHub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCard" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" gradientUnits="userSpaceOnUse" x1="128" y1="0" x2="334" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#grid)" opacity="0.6"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#1E3350" stroke-width="6"/>

  <!-- glows -->
  <circle cx="236" cy="256" r="120" fill="url(#glowHub)"/>
  <circle cx="392" cy="256" r="104" fill="url(#glowCard)"/>

  <!-- the library: many skills, dimmed -->
  <g stroke="#22324F" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M128 136 C 176 136, 186 236, 236 256"/>
    <path d="M128 196 C 172 196, 190 246, 236 256"/>
    <path d="M128 316 C 172 316, 190 266, 236 256"/>
    <path d="M128 376 C 176 376, 186 276, 236 256"/>
  </g>
  <g fill="#132036" stroke="#30486F" stroke-width="5">
    <rect x="76" y="114" width="52" height="44" rx="12"/>
    <rect x="76" y="174" width="52" height="44" rx="12"/>
    <rect x="76" y="294" width="52" height="44" rx="12"/>
    <rect x="76" y="354" width="52" height="44" rx="12"/>
  </g>

  <!-- the chosen skill's path into the router -->
  <path d="M128 256 L 236 256" stroke="url(#route)" stroke-width="10" stroke-linecap="round"/>
  <rect x="76" y="234" width="52" height="44" rx="12" fill="#0B2A22" stroke="#34D399" stroke-width="5"/>

  <!-- router hub -->
  <circle cx="236" cy="256" r="44" fill="#0B2A22" stroke="#34D399" stroke-width="9"/>
  <circle cx="236" cy="256" r="15" fill="#34D399"/>

  <!-- single route out to the loaded skill -->
  <path d="M280 256 L 334 256" stroke="url(#route)" stroke-width="12" stroke-linecap="round"/>

  <!-- the one SKILL.md loaded into context -->
  <rect x="334" y="186" width="116" height="140" rx="22" fill="url(#card)"/>
  <g stroke="#07231B" stroke-width="10" stroke-linecap="round" opacity="0.85">
    <path d="M358 220 H 426"/>
    <path d="M358 248 H 412"/>
    <path d="M358 276 H 426"/>
    <path d="M358 302 H 398"/>
  </g>
</svg>
