[project]
name = "mcp-manage-router-skill"
version = "1.0.0"
description = "MCP Server + Meta-Skill de roteamento de skills: indexa, busca e sugere skills locais sem estourar a janela de contexto."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-MIT-Commons-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Dyone Andrade", email = "contato@dyonedev.com.br" }]
dependencies = [
    "fastmcp>=2.10",
    "pyyaml>=6.0",
]
keywords = ["mcp", "skills", "agent-skills", "claude-code", "gemini-cli", "cursor"]

[project.scripts]
skills-router = "skills_router_mcp.installer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skills_router_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "skills_router_mcp/templates"

[tool.hatch.build.targets.sdist]
include = ["src", "templates", "README.md", "pyproject.toml"]
